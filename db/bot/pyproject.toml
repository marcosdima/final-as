[project]
name = "isft189-api"
version = "2.0.0"
description = "Unified Academic & RAG Virtual Assistant API for ISFT 189"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["app/.venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PIE", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/models/*.py" = ["RUF012"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]
